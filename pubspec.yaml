name: proyecto_app_delivery_gessof
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.44+44

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^17.2.4
  image_picker: ^1.2.0
  http: ^1.2.2
  http_parser: ^4.0.2
  path: ^1.9.0
  url_launcher: ^6.3.1
  flutter_lints: ^5.0.0
  sn_progress_dialog: ^1.2.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geocoding: ^4.0.0
  # Rama B: geolocator para my location del repartidor (futuro).
  geolocator: ^13.0.0
  workmanager: ^0.8.0
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/steps/
    - assets/illustrations/states/
    - assets/illustrations/markers/
    - assets/illustrations/address/
  # Archivo (SIL OFL 1.1, ver assets/fonts/OFL.txt): tipografía del cliente.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-Black.ttf
          weight: 900
        - asset: assets/fonts/Archivo-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Archivo-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Archivo-BlackItalic.ttf
          weight: 900
          style: italic
